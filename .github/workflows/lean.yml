name: Lean CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      performance_runs:
        description: Measured experiment repetitions (1 for smoke, 10 for repeated timings)
        type: string
        default: "1"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1
        with:
          build: true

      - name: Run fast test suite
        run: lake test

      - name: Validate report renderer and saved reference data
        run: |
          mkdir -p experiments/reference
          tar -xzf artifact/reference-results.tar.gz -C experiments/reference
          lake exe experiment-tables --self-test
          lake exe experiment-tables --test-data experiments/reference

      - name: Build DSL examples
        run: lake build LeanUfo.UFO.DSL.Examples

  full-test-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      run-full-tests: ${{ steps.gate.outputs.run-full-tests }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: gate
        name: Check recent activity
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run-full-tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin dev --depth=100

          if git log --since="24 hours ago" --format=%H --max-count=1 origin/dev | grep -q .; then
            echo "run-full-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-full-tests=false" >> "$GITHUB_OUTPUT"
          fi

  full-semantic-tests:
    needs: full-test-gate
    if: needs.full-test-gate.outputs.run-full-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}

      - uses: leanprover/lean-action@v1
        with:
          build: true

      - name: Install table-rendering dependencies before measurements
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Run full suite, performance experiments, and report generation
        run: lake test
        env:
          LEANUFO_FULL_TESTS: "1"
          LEANUFO_PERFORMANCE_TESTS: ${{ inputs.performance_runs || '1' }}
          UFO_GENERATE_TABLES: ${{ inputs.performance_runs == '0' && '0' || '1' }}

      - name: Preserve experiment observations and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-experiments
          path: experiments/
          if-no-files-found: warn
          retention-days: 14
